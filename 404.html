

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the woods · PocketOregon</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0e1511;--fg:#e8efe9;--muted:#8fa396;--accent:#5fd38d;--card:#16201a}
@media (prefers-color-scheme:light){:root{--bg:#f4f8f5;--fg:#14211a;--muted:#5d7566;--accent:#1f9d55;--card:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 0,rgba(95,211,141,.12),transparent),var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px}
.card{max-width:460px;width:100%;text-align:center;background:var(--card);border:1px solid rgba(143,163,150,.2);border-radius:20px;padding:40px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.code{font-size:84px;font-weight:800;letter-spacing:-3px;line-height:1;margin:0;color:var(--accent)}
h1{font-size:22px;margin:14px 0 8px}
p{color:var(--muted);margin:0 0 26px;line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{padding:11px 20px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--accent);color:var(--accent)}
a.btn.primary{background:var(--accent);color:#07140c}
a.btn:hover{opacity:.85}
</style>
</head>
<body>
<main class="card">
  <p class="code">404</p>
  <h1>This page wandered off</h1>
  <p>The link may be broken or the page may have moved. Let's get you back on the trail.</p>
  <div class="row">
    <a class="btn primary" href="/">Go home</a>
    <a class="btn" href="javascript:history.back()">Go back</a>
  </div>
</main>
</body>
</html>
