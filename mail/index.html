<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail — PocketOregon</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #1f1e24; min-height: 100vh; }
    .outfit { font-family: 'Outfit', sans-serif; }
    nav { background: white; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 10; }
    .nav-inner { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1f1e24; font-family: 'Outfit', sans-serif; font-weight: 800; }
    .nav-back { font-size: 0.875rem; color: #6b7280; text-decoration: none; }
    main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 1.25rem; }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid #e5e7eb; margin-bottom: 1rem; }
    .tab { background: none; border: none; padding: 10px 16px; font-size: 0.9rem; font-weight: 600; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: #1f1e24; border-bottom-color: #f97316; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; }
    .row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f3f4f6; font-size: 0.9rem; }
    .row:last-child { border-bottom: none; }
    .row.unread { font-weight: 600; }
    .addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #374151; }
    .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .date { font-size: 0.78rem; color: #9ca3af; white-space: nowrap; }
    .empty { text-align: center; padding: 3rem 1rem; color: #9ca3af; font-size: 0.9rem; }
    .msg { padding: 2rem; text-align: center; color: #6b7280; }
    .msg a { color: #f97316; font-weight: 600; }
    .compose-btn { background: #1f1e24; color: white; border: none; border-radius: 6px; padding: 8px 18px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
    .compose-btn:hover { background: #374151; }
    .compose-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .cancel-btn { background: #f3f4f6; color: #374151; border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
    .compose { padding: 1.25rem; margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 10px; }
    .compose input, .compose textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 6px; padding: 9px 12px; font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none; }
    .compose input:focus, .compose textarea:focus { border-color: #f97316; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr auto; } .subj { grid-column: 1 / -1; } }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#ea580c"><path d="M12 2L2 8l3 3 7-4 7 4 3-3-10-6z M12 8l-5 4 5 10 5-10-5-4z"/></svg>
      <span>PocketOregon</span>
    </a>
    <a href="/" class="nav-back">← Back to site</a>
  </div>
</nav>

<main>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
    <h1 style="margin:0;">Mail</h1>
    <button class="compose-btn" onclick="toggleCompose()">Compose</button>
  </div>

  <div id="compose" class="card compose" style="display:none;">
    <input id="c-to" type="email" placeholder="To" />
    <input id="c-subject" type="text" placeholder="Subject" maxlength="200" />
    <textarea id="c-body" rows="8" placeholder="Write your message..."></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
      <span id="c-status" style="font-size:0.85rem;color:#6b7280;"></span>
      <div style="display:flex;gap:8px;">
        <button class="cancel-btn" onclick="toggleCompose()">Cancel</button>
        <button class="compose-btn" id="c-send" onclick="sendMail()">Send</button>
      </div>
    </div>
  </div>

  <div id="signed-out" class="card msg" style="display:none;">
    <p>Sign in to see your mail.</p>
    <p style="margin-top:0.75rem;"><a href="/signin.html?redirect=/mail/">Sign in with Google</a></p>
  </div>

  <div id="mail-view" style="display:none;">
    <div id="mb-wrap" style="display:none;margin-bottom:1rem;">
      <label style="font-size:0.85rem;color:#6b7280;margin-right:8px;">Mailbox:</label>
      <select id="mb-select" onchange="changeMailbox(this.value)" style="padding:6px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:0.9rem;background:white;"></select>
    </div>
    <div class="tabs">
      <button class="tab active" data-folder="inbox" onclick="switchTab('inbox')">Inbox</button>
      <button class="tab" data-folder="sent" onclick="switchTab('sent')">Outbox</button>
    </div>
    <div id="reader" class="card" style="display:none;padding:1.25rem;">
      <button class="cancel-btn" onclick="closeMessage()">← Back</button>
      <div id="r-head" style="margin:1rem 0;"></div>
      <div id="r-body" style="white-space:pre-wrap;font-size:0.95rem;line-height:1.6;"></div>
    </div>
    <div class="card" id="list"><div class="empty">Loading...</div></div>
  </div>
</main>

<script>
  const WORKER_URL = 'https://po.pocketoregon.workers.dev';
  let currentFolder = 'inbox';

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmt(ts) {
    if (!ts) return '';
    const d = new Date(ts.replace(' ', 'T') + 'Z');
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
           d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function loadFolder(folder) {
    const list = document.getElementById('list');
    list.innerHTML = '<div class="empty">Loading...</div>';
    const token = localStorage.getItem('po_token');
    try {
      const res = await fetch(`${WORKER_URL}/mail?folder=${folder}${currentMailbox ? '&mailbox_id=' + currentMailbox : ''}`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) {
        document.getElementById('mail-view').style.display = 'none';
        document.getElementById('signed-out').style.display = 'block';
        return;
      }
      const data = await res.json();
      const messages = data.messages || [];
      if (messages.length === 0) {
        list.innerHTML = `<div class="empty">No ${folder === 'inbox' ? 'received' : 'sent'} mail.</div>`;
        return;
      }
      list.innerHTML = messages.map(m => {
        const who = folder === 'inbox' ? m.from_addr : 'To: ' + m.to_addr;
        const unread = folder === 'inbox' && !m.is_read ? ' unread' : '';
        return `<div class="row${unread}" style="cursor:pointer;" onclick="openMessage(${m.id})">
          <div class="addr">${esc(who)}</div>
          <div class="subj">${esc(m.subject || '(no subject)')}</div>
          <div class="date">${fmt(m.created_at)}</div>
        </div>`;
      }).join('');
    } catch (e) {
      list.innerHTML = '<div class="empty">Could not load mail. Try again.</div>';
    }
  }

  let currentMailbox = '';

  async function loadMailboxes() {
    const token = localStorage.getItem('po_token');
    try {
      const res = await fetch(`${WORKER_URL}/mail/mailboxes`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      const boxes = data.mailboxes || [];
      const wrap = document.getElementById('mb-wrap');
      const select = document.getElementById('mb-select');
      if (boxes.length === 0) {
        wrap.style.display = 'block';
        wrap.innerHTML = '<span style="font-size:0.9rem;color:#6b7280;">You have no mailbox yet. Ask the admin to create one for you.</span>';
        return;
      }
      select.innerHTML = boxes.map(b =>
        `<option value="${b.id}">${esc(b.address)}${b.status !== 'active' ? ' (' + esc(b.status) + ')' : ''}</option>`
      ).join('');
      currentMailbox = String(boxes[0].id);
      select.value = currentMailbox;
      wrap.style.display = 'block';
    } catch (e) {
      console.error('Could not load mailboxes', e);
    }
  }

  function changeMailbox(id) {
    currentMailbox = id;
    loadFolder(currentFolder);
  }

  function switchTab(folder) {
    closeMessage();
    currentFolder = folder;
    document.querySelectorAll('.tab').forEach(t =>
      t.classList.toggle('active', t.dataset.folder === folder));
    loadFolder(folder);
  }

  function stripHtml(h) {
    const doc = new DOMParser().parseFromString(
      String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n'), 'text/html');
    return doc.body.textContent.trim();
  }

  async function openMessage(id) {
    const token = localStorage.getItem('po_token');
    const res = await fetch(`${WORKER_URL}/mail/message/${id}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) return;
    const { message: m } = await res.json();
    const who = m.direction === 'in' ? 'From: ' + m.from_addr : 'To: ' + m.to_addr;
    document.getElementById('r-head').innerHTML =
      `<div style="font-size:1.1rem;font-weight:700;">${esc(m.subject || '(no subject)')}</div>` +
      `<div style="color:#6b7280;font-size:0.85rem;margin-top:4px;">${esc(who)} · ${fmt(m.created_at)}</div>`;
    document.getElementById('r-body').textContent = stripHtml(m.body);
    document.getElementById('list').style.display = 'none';
    document.querySelector('.tabs').style.display = 'none';
    document.getElementById('reader').style.display = 'block';
  }

  function closeMessage() {
    document.getElementById('reader').style.display = 'none';
    document.getElementById('list').style.display = 'block';
    document.querySelector('.tabs').style.display = 'flex';
  }

  function toggleCompose() {
    const box = document.getElementById('compose');
    box.style.display = box.style.display === 'none' ? 'flex' : 'none';
  }

  async function sendMail() {
    const to = document.getElementById('c-to').value.trim();
    const subject = document.getElementById('c-subject').value.trim();
    const body = document.getElementById('c-body').value.trim();
    const status = document.getElementById('c-status');
    const btn = document.getElementById('c-send');
    if (!to || !subject || !body) { status.textContent = 'Fill in all fields.'; return; }

    btn.disabled = true;
    status.textContent = 'Sending...';
    try {
      const res = await fetch(`${WORKER_URL}/mail/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('po_token') },
        body: JSON.stringify({
          mailbox_id: currentMailbox ? parseInt(currentMailbox) : null,
          to,
          subject,
          html: '<p>' + body.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>') + '</p>'
        })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Send failed');
      document.getElementById('c-to').value = '';
      document.getElementById('c-subject').value = '';
      document.getElementById('c-body').value = '';
      status.textContent = 'Sent.';
      toggleCompose();
      switchTab('sent');
    } catch (e) {
      status.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  }

  window.addEventListener('load', () => {
    const token = localStorage.getItem('po_token');
    if (!token) {
      document.getElementById('signed-out').style.display = 'block';
      return;
    }
    document.getElementById('mail-view').style.display = 'block';
    loadMailboxes();
    loadFolder(currentFolder);
  });
</script>
</body>
</html>
