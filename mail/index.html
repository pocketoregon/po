<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail — PocketOregon</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/avatar.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Default values, used if no theme file loads. Themes override these. */
  :root {
    --page: #f9fafb;
    --surface: #ffffff;
    --text: #1f1e24;
    --text-muted: #6b7280;
    --accent: #f97316;
    --btn: #1f1e24;
    --btn-light: #f3f4f6;
    --bubble-in: #ffffff;
    --bubble-out: #1f1e24;
    --input: #ffffff;
    --border: #e5e7eb;
    --btn-text: #ffffff;
    --bubble-out-text: #ffffff;
    --deco: #9ca3af;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--page); color: var(--text); min-height: 100vh; }
  nav { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-family: 'Outfit', sans-serif; font-weight: 800; }
  .nav-back { font-size: 0.875rem; color: var(--text-muted); text-decoration: none; }
  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem; }
  .msg { padding: 2rem; text-align: center; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .msg a { color: var(--accent); font-weight: 600; }

  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; }
  .top h1 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; margin-right: auto; }
  .status { font-size: 0.8rem; color: var(--text-muted); }
  .btn { background: var(--btn); color: var(--btn-text); border: none; border-radius: 6px; padding: 8px 16px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-light { background: var(--btn-light); color: var(--text); }

  /* Custom dropdown */
  .dropdown { border: 1px solid var(--border); border-radius: 12px; transition: all 300ms; display: flex; flex-direction: column; min-height: 42px; background-color: var(--surface); overflow: visible; position: relative; max-width: 280px; min-width: 140px; }
  .dropdown input:where(:checked) ~ .dd-list { opacity: 1; transform: translateY(0); pointer-events: auto; transition: opacity 220ms ease, transform 220ms ease; }
  .dropdown input:where(:not(:checked)) ~ .dd-list { opacity: 0; transform: translateY(-6px); user-select: none; pointer-events: none; transition: opacity 180ms ease-out, transform 180ms ease-out; }
  .dropdown input:where(:checked) + .trigger:before { rotate: 90deg; transition-delay: 0ms; }
  .trigger { cursor: pointer; list-style: none; user-select: none; font-weight: 600; color: var(--text); width: 100%; display: flex; align-items: center; flex-flow: row-reverse; justify-content: space-between; gap: 0.5rem; padding: 0.55rem 0.85rem; height: max-content; position: relative; z-index: 99; border-radius: inherit; background-color: var(--surface); font-size: 0.875rem; font-family: 'Inter', sans-serif; }
  .trigger:before { content: "\203a"; position: relative; display: flex; justify-content: center; align-items: center; rotate: -90deg; width: 17px; height: 17px; color: var(--text); border-radius: 2px; font-size: 26px; transition: all 350ms ease; transition-delay: 85ms; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0; }
  .dd-list { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 16rem; display: grid; grid-auto-flow: row; overflow: hidden auto; overscroll-behavior: contain; gap: 0.3rem; padding: 0.4rem; margin: 0; list-style: none; background-color: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.15); z-index: 1000; }
  .listitem { width: 100%; list-style: none; }
  .article { padding: 0.38rem 0.7rem; border-radius: 6px; font-size: 12.5px; font-weight: 500; text-align: left; width: 100%; border: 1px solid var(--border); display: inline-block; background-color: var(--surface); cursor: pointer; font-family: 'Inter', sans-serif; color: var(--text); box-sizing: border-box; }
  .article:hover { border-color: var(--accent); color: var(--accent); }
  .article.selected { background-color: var(--btn); border-color: var(--btn); color: var(--btn-text); }

  /* Skeleton placeholders */
  .sk { position: relative; overflow: hidden; background: var(--border); border-radius: 6px; }
  .sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 70%, transparent), transparent); animation: sk-shine 1.2s infinite; }
  @keyframes sk-shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .dd-skel { height: 42px; width: 170px; border-radius: 12px; }
  .sk-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sk-av { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; }
  .sk-line { height: 10px; margin-bottom: 8px; }
  .sk-line:last-child { margin-bottom: 0; }
  .sk-bubble-row { display: flex; gap: 8px; align-items: flex-end; }
  .sk-bubble-row.out { flex-direction: row-reverse; }
  .sk-bubble { height: 56px; width: 55%; border-radius: 12px; }
  .sk-bubble-row.out .sk-bubble { width: 45%; }
  .sk-bubble-av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }

  /* Decorative background icons */
  .deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .deco-icon {
    position: absolute;
    display: block;
    opacity: 0.18;
    animation: drift var(--dur) linear infinite;
    animation-delay: var(--delay, 0s);
  }
  /* Travels from beyond the bottom-left edge to beyond the top-right edge, then loops */
  @keyframes drift {
    from { transform: translate(-30vw, 30vh) rotate(-35deg); }
    to   { transform: translate(130vw, -130vh) rotate(-35deg); }
  }
  @media (prefers-reduced-motion: reduce) { .deco-icon { animation: none; } }

  .panes { display: grid; grid-template-columns: 320px 1fr; height: 72vh; min-height: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .list { border-right: 1px solid var(--border); overflow-y: auto; }
  .thread { display: flex; flex-direction: column; min-height: 0; }
  .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.9rem; }

  .convo { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .convo:hover { filter: brightness(0.97); }
  .convo.active { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .cbody { flex: 1; min-width: 0; }
  .crow { display: flex; justify-content: space-between; gap: 8px; }
  .cname { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cname.bold { font-weight: 700; }
  .ctime { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; }
  .csub { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .via { font-size: 0.7rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .badge { background: var(--accent); color: var(--btn-text); font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 2px 7px; }

  .thead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .tname { font-weight: 700; font-size: 0.95rem; }
  .taddr { font-size: 0.78rem; color: var(--text-muted); }
  .back { display: none; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text); }

  .msgs { flex: 1; overflow-y: auto; padding: 16px; background: var(--page); display: flex; flex-direction: column; gap: 10px; }
  .row-msg { display: flex; gap: 8px; align-items: flex-end; }
  .row-msg.out { justify-content: flex-start; flex-direction: row-reverse; }
  .bubble { max-width: 72%; background: var(--bubble-in); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .row-msg.out .bubble { background: var(--bubble-out); color: var(--bubble-out-text); border-color: var(--bubble-out); }
  .bsubj { font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; overflow-wrap: anywhere; }
  .row-msg.out .bsubj { opacity: 0.85; }
  .btext { font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
  .btime { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; text-align: right; }
  .row-msg.out .btime { opacity: 0.7; color: var(--bubble-out-text); }

  .reply { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .reply textarea, .compose-form textarea, .compose-form input, .compose-form select { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 0.9rem; font-family: 'Inter', sans-serif; outline: none; resize: vertical; background: var(--input); color: var(--text); }
  .reply textarea:focus, .compose-form textarea:focus, .compose-form input:focus, .compose-form select:focus { border-color: var(--accent); }
  .compose-form { display: flex; flex-direction: column; gap: 10px; padding: 16px; flex: 1; overflow-y: auto; }
  .row-end { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  @media (max-width: 760px) {
    .panes { grid-template-columns: 1fr; }
    .thread { display: none; }
    .panes.show-thread .list { display: none; }
    .panes.show-thread .thread { display: flex; }
    .back { display: inline-block; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#ea580c"><path d="M12 2L2 8l3 3 7-4 7 4 3-3-10-6z M12 8l-5 4 5 10 5-10-5-4z"/></svg>
      <span>PocketOregon</span>
    </a>
    <a href="/" class="nav-back">← Back to site</a>
  </div>
</nav>

<main>
  <div id="signed-out" class="msg" style="display:none;">
    <p>Sign in to see your mail.</p>
    <p style="margin-top:0.75rem;"><a href="/signin.html?redirect=/mail/">Sign in with Google</a></p>
  </div>

  <div id="mail-view" style="display:none;">
    <div class="top">
      <h1>Mail</h1>
      <div class="dropdown" id="theme-dd"><div class="sk dd-skel"></div></div>
      <div class="dropdown" id="mb-dd"><div class="sk dd-skel"></div></div>
      <span id="status" class="status"></span>
      <button class="btn btn-light" id="refresh-btn" onclick="refreshMail()">Refresh</button>
      <button class="btn" id="new-btn" onclick="openNew()">New message</button>
    </div>

    <div class="panes" id="panes">
      <aside class="list" id="convo-list">
        <div class="sk-row"><div class="sk sk-av"></div><div style="flex:1;min-width:0;"><div class="sk sk-line" style="width:45%;"></div><div class="sk sk-line" style="width:70%;"></div></div></div>
        <div class="sk-row"><div class="sk sk-av"></div><div style="flex:1;min-width:0;"><div class="sk sk-line" style="width:45%;"></div><div class="sk sk-line" style="width:70%;"></div></div></div>
        <div class="sk-row"><div class="sk sk-av"></div><div style="flex:1;min-width:0;"><div class="sk sk-line" style="width:45%;"></div><div class="sk sk-line" style="width:70%;"></div></div></div>
        <div class="sk-row"><div class="sk sk-av"></div><div style="flex:1;min-width:0;"><div class="sk sk-line" style="width:45%;"></div><div class="sk sk-line" style="width:70%;"></div></div></div>
      </aside>
      <section class="thread" id="thread">
        <div class="empty">Select a conversation or start a new message.</div>
      </section>
    </div>
  </div>
</main>

<script>
  const WORKER_URL = 'https://po.pocketoregon.workers.dev';
  const THEME_KEY = 'po_mail_theme';
  const ALL = 'all';

  let themeIndex = null;
  let mailboxes = [];
  let currentMailbox = ALL;            // ALL, or a mailbox id
  let rows = { inbox: [], sent: [] };  // list rows, loaded on open / refresh only
  const bodies = new Map();            // message id -> body text
  let currentKey = null;               // conversation key: "<mailboxId>|<address>"
  let composing = false;
  let busy = false;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ---------- Dropdowns ----------
  // items: [{ id, name }], selected: id string, onPick: called with the chosen id.
  function dropdown(containerId, items, selected, onPick) {
    const box = $(containerId);
    const uid = containerId + '-toggle';
    const current = items.find(i => i.id === String(selected)) || items[0];
    box.innerHTML = `
      <input type="checkbox" class="sr-only" id="${uid}">
      <label for="${uid}" class="trigger">${esc(current ? current.name : '')}</label>
      <ul class="dd-list">${items.map(i => `
        <li class="listitem"><button type="button" class="article ${current && i.id === current.id ? 'selected' : ''}" data-id="${esc(i.id)}">${esc(i.name)}</button></li>`).join('')}
      </ul>`;
    box.querySelectorAll('.article').forEach(btn => btn.addEventListener('click', () => {
      document.getElementById(uid).checked = false;
      onPick(btn.dataset.id);
    }));
  }

  function renderThemeDropdown(selectedId) {
    const list = (themeIndex && themeIndex.themes) || [];
    if (!list.length) { $('theme-dd').style.display = 'none'; return; }
    dropdown('theme-dd', list.map(t => ({ id: t.id, name: t.name })), selectedId, changeTheme);
  }

  // ---------- Themes ----------
  // Themes live in /theme. index.json lists them; each file maps role names to colors.
  // Every key in a theme file becomes a CSS variable: "accent" -> --accent.
  async function loadThemeIndex() {
    try {
      const res = await fetch('/theme/index.json');
      themeIndex = await res.json();
    } catch (e) {
      themeIndex = { default: 'default', themes: [] };
    }
  }

  async function applyTheme(id) {
    const list = (themeIndex && themeIndex.themes) || [];
    const entry = list.find(t => t.id === id) || list.find(t => t.id === themeIndex.default);
    if (!entry) return;
    try {
      const res = await fetch('/theme/' + entry.file);
      if (!res.ok) throw new Error('theme not found');
      const values = await res.json();
      Object.entries(values).forEach(([key, value]) => {
        if (key === 'name') return;
        document.documentElement.style.setProperty('--' + key, value);
      });
      renderThemeDropdown(entry.id);
    } catch (e) {
      console.warn('Theme could not load, using defaults:', e);
    }
  }

  async function changeTheme(id) {
    localStorage.setItem(THEME_KEY, id);
    await applyTheme(id);
    buildDeco();   // icon color follows the theme's "deco" value
  }

  async function initTheme() {
    await loadThemeIndex();
    const saved = localStorage.getItem(THEME_KEY);
    const id = saved || (themeIndex && themeIndex.default);
    if (id) await applyTheme(id);
    else renderThemeDropdown(null);
  }

  // ---------- Helpers ----------
  // "Pocket Core" <a@b.com>  ->  a@b.com
  function addrOf(s) {
    const m = String(s || '').match(/<([^>]+)>/);
    return (m ? m[1] : String(s || '')).trim().toLowerCase();
  }
  function nameOf(s) {
    const m = String(s || '').match(/^\s*"?([^"<]+?)"?\s*</);
    return m ? m[1].trim() : addrOf(s);
  }
  function fmt(ts) {
    if (!ts) return '';
    const d = new Date(ts.replace(' ', 'T') + 'Z');
    const sameDay = new Date().toDateString() === d.toDateString();
    return sameDay
      ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }
  function cleanSubject(s) {
    return String(s || '').replace(/^(re:\s*)+/i, '').trim();
  }
  function setStatus(t) { $('status').textContent = t; }
  function mailboxAddress(id) {
    const b = mailboxes.find(x => String(x.id) === String(id));
    return b ? b.address : '';
  }
  function mailboxIds() {
    return mailboxes.map(b => String(b.id));
  }

  async function api(path, opts = {}) {
    const res = await fetch(WORKER_URL + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('po_token'),
        ...(opts.headers || {})
      }
    });
    if (res.status === 401) throw new Error('signed-out');
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  function handleErr(e, msg) {
    if (e.message === 'signed-out') {
      $('mail-view').style.display = 'none';
      $('signed-out').style.display = 'block';
    } else {
      setStatus(msg || 'Could not load mail.');
    }
  }

  // ---------- Mailboxes ----------
  async function loadMailboxes() {
    const data = await api('/mail/mailboxes');
    mailboxes = data.mailboxes || [];
    if (!mailboxes.length) {
      $('mb-dd').style.display = 'none';
      $('new-btn').style.display = 'none';
      $('panes').style.display = 'none';
      setStatus('You have no mailbox yet. Ask the admin to create one for you.');
      return false;
    }
    const items = [{ id: ALL, name: 'All inboxes' }].concat(mailboxes.map(b => ({
      id: String(b.id),
      name: b.address + (b.status !== 'active' ? ' (' + b.status + ')' : '')
    })));
    dropdown('mb-dd', items, currentMailbox, changeMailbox);
    return true;
  }

  // Fetches the inbox and sent folders for each given mailbox id and merges them.
  async function fetchFolders(ids) {
    const pairs = await Promise.all(ids.map(id => Promise.all([
      api(`/mail?folder=inbox&mailbox_id=${id}`),
      api(`/mail?folder=sent&mailbox_id=${id}`)
    ])));
    return {
      inbox: pairs.flatMap(p => p[0].messages || []),
      sent: pairs.flatMap(p => p[1].messages || [])
    };
  }

  // Runs on load, Refresh, mailbox change, and after sending.
  async function refreshMail() {
    if (!mailboxes.length || busy) return;
    busy = true;
    $('refresh-btn').disabled = true;
    setStatus('Loading...');
    if (!rows.inbox.length && !rows.sent.length) {
      $('convo-list').innerHTML = listSkeleton();
    }
    try {
      const ids = currentMailbox === ALL ? mailboxIds() : [currentMailbox];
      const data = await fetchFolders(ids);
      rows.inbox = data.inbox;
      rows.sent = data.sent;
      renderList();
      if (currentKey && !composing) {
        await loadBodies(currentConv());
        renderMessages();
      }
      setStatus('Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    } catch (e) {
      handleErr(e);
    } finally {
      busy = false;
      $('refresh-btn').disabled = false;
    }
  }

  // ---------- Conversations ----------
  // One conversation per (your mailbox, their address). This keeps replies on the right address.
  function conversations() {
    const map = new Map();
    const add = (m, dir, peerRaw, pStyle, pSeed) => {
      const peer = addrOf(peerRaw);
      if (!peer) return;
      const mid = String(m.mailbox_id);
      const key = mid + '|' + peer;
      if (!map.has(key)) map.set(key, { key, mid, peer, name: nameOf(peerRaw), msgs: [], unread: 0 });
      const c = map.get(key);
      c.msgs.push({ ...m, dir });
      if (dir === 'in' && !m.is_read) c.unread++;
      if (pSeed) { c.style = pStyle; c.seed = pSeed; }
      if (nameOf(peerRaw) !== addrOf(peerRaw)) c.name = nameOf(peerRaw);
    };
    rows.inbox.forEach(m => add(m, 'in', m.from_addr, m.sender_style, m.sender_seed));
    rows.sent.forEach(m => add(m, 'out', m.to_addr, m.recipient_style, m.recipient_seed));
    const list = [...map.values()];
    list.forEach(c => {
      c.msgs.sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
      c.last = c.msgs[c.msgs.length - 1];
    });
    return list.sort((a, b) => (a.last.created_at < b.last.created_at ? 1 : -1));
  }

  function currentConv() {
    return conversations().find(c => c.key === currentKey) || null;
  }

  function listSkeleton(count = 6) {
    const row = `
      <div class="sk-row">
        <div class="sk sk-av"></div>
        <div style="flex:1; min-width:0;">
          <div class="sk sk-line" style="width:45%;"></div>
          <div class="sk sk-line" style="width:70%;"></div>
        </div>
      </div>`;
    return row.repeat(count);
  }

  function renderList() {
    const list = conversations();
    if (!list.length) {
      $('convo-list').innerHTML = '<div class="empty">No conversations yet. Use New message to start one.</div>';
      return;
    }
    const showVia = currentMailbox === ALL;
    $('convo-list').innerHTML = list.map(c => `
      <div class="convo ${c.key === currentKey && !composing ? 'active' : ''}" data-key="${esc(c.key)}" onclick="openThread(this.dataset.key)">
        ${window.poAvatarHTML({ name: c.name, avatar_style: c.style, avatar_seed: c.seed }, 38)}
        <div class="cbody">
          <div class="crow">
            <span class="cname ${c.unread ? 'bold' : ''}">${esc(c.name)}</span>
            <span class="ctime">${fmt(c.last.created_at)}</span>
          </div>
          <div class="csub">${c.last.dir === 'out' ? 'You: ' : ''}${esc(cleanSubject(c.last.subject) || '(no subject)')}</div>
          ${showVia ? `<div class="via">via ${esc(mailboxAddress(c.mid))}</div>` : ''}
        </div>
        ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}
      </div>`).join('');
  }

  // Loads bodies only for messages not already fetched. Opening a message also marks it read on the server.
  async function loadBodies(conv) {
    if (!conv) return;
    const missing = conv.msgs.filter(m => !bodies.has(m.id));
    await Promise.all(missing.map(async m => {
      try {
        const d = await api(`/mail/message/${m.id}`);
        bodies.set(m.id, d.message.body || '');
        const r = rows.inbox.find(x => x.id === m.id);
        if (r) r.is_read = 1;
      } catch (e) {
        bodies.set(m.id, '(could not load this message)');
      }
    }));
  }

  function bubbleSkeleton() {
    const rowsHtml = ['in', 'out', 'in', 'out'].map(dir => `
      <div class="sk-bubble-row ${dir}">
        <div class="sk sk-bubble-av"></div>
        <div class="sk sk-bubble"></div>
      </div>`).join('');
    return `<div class="msgs" id="msgs">${rowsHtml}</div>`;
  }

  function renderMessages() {
    const box = $('msgs');
    if (!box) return;
    const conv = currentConv();
    if (!conv) {
      box.innerHTML = '<div class="empty">No messages.</div>';
      return;
    }
    let prev = null;
    box.innerHTML = conv.msgs.map(m => {
      const subj = cleanSubject(m.subject);
      const showSubj = subj !== prev;
      prev = subj;
      const body = bodies.has(m.id) ? bodies.get(m.id) : '…';
      const isOut = m.dir === 'out';
      const avatar = window.poAvatarHTML(
        isOut
          ? { name: 'Me', avatar_style: m.recipient_style, avatar_seed: m.recipient_seed }
          : { name: nameOf(m.from_addr), avatar_style: m.sender_style, avatar_seed: m.sender_seed },
        28
      );
      return `
        <div class="row-msg ${isOut ? 'out' : 'in'}">${avatar}
          <div class="bubble">
            ${showSubj ? `<div class="bsubj">${esc(m.subject || '(no subject)')}</div>` : ''}
            <div class="btext">${esc(body)}</div>
            <div class="btime">${fmt(m.created_at)}</div>
          </div>
        </div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  async function openThread(key) {
    currentKey = key;
    composing = false;
    $('panes').classList.add('show-thread');
    const conv = currentConv();
    $('thread').innerHTML = `
      <div class="thead">
        <button class="back" onclick="closeThread()">←</button>
        <div>
          <div class="tname">${esc(conv ? conv.name : '')}</div>
          <div class="taddr">${esc(conv ? conv.peer : '')}${conv ? ' · via ' + esc(mailboxAddress(conv.mid)) : ''}</div>
        </div>
      </div>
      ${bubbleSkeleton()}
      <form class="reply" onsubmit="event.preventDefault(); sendReply();">
        <textarea id="reply-body" rows="2" placeholder="Write a reply..."></textarea>
        <button class="btn" type="submit" id="send-btn">Send</button>
      </form>`;
    renderList();
    await loadBodies(conv);
    renderMessages();
  }

  function closeThread() {
    $('panes').classList.remove('show-thread');
    currentKey = null;
    composing = false;
    renderList();
  }

  // ---------- Sending ----------
  async function deliver(to, subject, text, mailboxId) {
    return api('/mail/send', {
      method: 'POST',
      body: JSON.stringify({
        mailbox_id: Number(mailboxId),
        to,
        subject,
        html: '<p>' + esc(text).replace(/\n/g, '<br>') + '</p>'
      })
    });
  }

  async function sendReply() {
    const text = $('reply-body').value.trim();
    const conv = currentConv();
    if (!text || !conv) return;
    const base = cleanSubject(conv.last.subject);
    const subject = base ? 'Re: ' + base : '(no subject)';
    const btn = $('send-btn');
    btn.disabled = true;
    try {
      await deliver(conv.peer, subject, text, conv.mid);
      $('reply-body').value = '';
      await refreshMail();
    } catch (e) {
      handleErr(e, 'Send failed: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  function openNew() {
    composing = true;
    currentKey = null;
    $('panes').classList.add('show-thread');
    const defaultFrom = currentMailbox !== ALL ? currentMailbox : mailboxIds()[0];
    $('thread').innerHTML = `
      <div class="thead">
        <button class="back" onclick="closeThread()">←</button>
        <div class="tname">New message</div>
      </div>
      <form class="compose-form" onsubmit="event.preventDefault(); sendNew();">
        <select id="n-from">${mailboxes.map(b =>
          `<option value="${b.id}" ${String(b.id) === String(defaultFrom) ? 'selected' : ''}>${esc(b.address)}</option>`
        ).join('')}</select>
        <input id="n-to" type="email" placeholder="To" required>
        <input id="n-subject" type="text" placeholder="Subject" maxlength="200" required>
        <textarea id="n-body" rows="10" placeholder="Write your message..." required></textarea>
        <div class="row-end">
          <span id="n-status" class="status"></span>
          <button class="btn" type="submit" id="n-send">Send</button>
        </div>
      </form>`;
    renderList();
  }

  async function sendNew() {
    const from = $('n-from').value;
    const to = $('n-to').value.trim();
    const subject = $('n-subject').value.trim();
    const text = $('n-body').value.trim();
    const st = $('n-status');
    const btn = $('n-send');
    btn.disabled = true;
    st.textContent = 'Sending...';
    try {
      await deliver(to, subject, text, from);
      composing = false;
      currentKey = from + '|' + addrOf(to);
      await refreshMail();
      await openThread(currentKey);
    } catch (e) {
      st.textContent = e.message;
      btn.disabled = false;
    }
  }

  function changeMailbox(id) {
    currentMailbox = id;
    rows = { inbox: [], sent: [] };
    bodies.clear();
    currentKey = null;
    composing = false;
    $('thread').innerHTML = '<div class="empty">Select a conversation or start a new message.</div>';
    $('panes').classList.remove('show-thread');
    refreshMail();
  }

  // ---------- Decorative icons ----------
  const DECO_ICONS = [
    'tabler/bat', 'tabler/pizza', 'tabler/question-mark', 'tabler/cross', 'tabler/circle',
    'tabler/cloud', 'tabler/car', 'tabler/ball-football', 'tabler/number-7', 'tabler/trophy'
  ];

  function buildDeco() {
    document.querySelectorAll('.deco').forEach(n => n.remove());
    const color = getComputedStyle(document.documentElement).getPropertyValue('--deco').trim() || '#9ca3af';
    const layer = document.createElement('div');
    layer.className = 'deco';
    layer.setAttribute('aria-hidden', 'true');
    const rowsN = 7, colsN = 9;
    for (let r = 0; r < rowsN; r++) {
      for (let c = 0; c < colsN; c++) {
        const name = DECO_ICONS[(r * 3 + c) % DECO_ICONS.length];
        const img = document.createElement('img');
        img.className = 'deco-icon';
        img.alt = '';
        img.src = `https://api.iconify.design/${name}.svg?color=${encodeURIComponent(color)}`;
        img.style.left = `${c * (100 / colsN) + r * 5 - 8}%`;
        img.style.top = `${r * (100 / rowsN) - 4}%`;
        const size = 34 + ((r * 7 + c * 5) % 4) * 8;
        img.style.width = img.style.height = size + 'px';
        img.style.setProperty('--dur', (18 + ((r + c) % 5) * 3) + 's');
        img.style.setProperty('--delay', `-${((r * colsN + c) * 1.7).toFixed(1)}s`);
        layer.appendChild(img);
      }
    }
    document.body.prepend(layer);
  }

  // ---------- Startup ----------
  window.addEventListener('load', async () => {
    const signedIn = !!localStorage.getItem('po_token');
    if (!signedIn) {
      $('signed-out').style.display = 'block';
      await initTheme();
      buildDeco();
      return;
    }
    $('mail-view').style.display = 'block';
    await initTheme();
    buildDeco();
    try {
      if (await loadMailboxes()) await refreshMail();
    } catch (e) {
      handleErr(e);
    }
  });
</script>
</body>
</html>
